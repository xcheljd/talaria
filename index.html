<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication Template Generator</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'light';
        var lightPalette = localStorage.getItem('lightPalette') || 'github';
        var darkPalette = localStorage.getItem('darkPalette') || 'github';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute(
          'data-light-palette',
          lightPalette
        );
        document.documentElement.setAttribute('data-dark-palette', darkPalette);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
