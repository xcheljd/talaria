<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication Template Generator</title>
    <link rel="stylesheet" href="/src/css/styles.css" />
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'light';
        var lightPalette = localStorage.getItem('lightPalette') || 'github';
        var darkPalette = localStorage.getItem('darkPalette') || 'github';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-light-palette', lightPalette);
        document.documentElement.setAttribute('data-dark-palette', darkPalette);
      })();
    </script>
    <style>
      body {
        padding-top: 110px; /* Space for fixed header */
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Communication Template Generator</h1>
        <div class="header-controls">
          <a
            href="promotion.html"
            class="nav-link"
            title="Promotion Email Generator"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            Promotions
          </a>
          <a href="start.html" class="profile-link" title="Edit your profile">
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
          <button
            class="theme-toggle"
            id="themeToggle"
            title="Toggle light/dark mode"
            aria-label="Toggle light/dark mode"
          >
            <div class="theme-toggle-slider"></div>
          </button>
        </div>
      </div>
      <div class="navigation" id="navigation">
        <div class="select-wrapper">
          <select
            class="template-select"
            id="templateSelect"
            aria-label="Select template"
          >
            <option value="">Select a template...</option>
          </select>
        </div>

        <div class="search-container">
          <input
            type="text"
            class="search-box"
            placeholder="Search templates..."
            id="searchBox"
            aria-label="Search templates"
          />
          <button
            class="clear-input clear-search"
            id="clearSearch"
            aria-label="Clear search"
            title="Clear"
          >
            ×
          </button>
          <div
            class="search-results"
            id="searchResults"
            role="listbox"
            aria-live="polite"
          >
            <div class="result-counter" id="resultCounter"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="page-content">
    <div class="container">
      <div class="card">
        <h2 class="section-title" id="formSectionTitle">Template Fields</h2>
        <div id="formFields" class="form-grid">
          <div class="placeholder-message" id="formPlaceholder">
            <p>Select a template to begin</p>
          </div>
        </div>
        <div class="button-group">
          <button class="btn" id="generateBtn">Generate</button>
          <button class="btn" id="clearBtn" disabled>Clear</button>
        </div>
      </div>

      <div class="card output-card" id="outputCard">
        <h2 class="section-title">Generated Message</h2>
        <textarea
          class="output-textarea"
          id="outputArea"
          placeholder="Your generated message will appear here..."
          aria-label="Generated message output"
        ></textarea>
        <div class="button-group">
          <button class="btn" id="copyBtn">Copy Message</button>
        </div>
      </div>
    </div>
    </div>

    <div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>

    <!-- Vite will automatically bundle and inject the JavaScript -->
    <script type="module" src="/src/js/app.js"></script>
  </body>
</html>
