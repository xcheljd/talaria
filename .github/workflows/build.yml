name: Build Desktop Apps

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        # Pinned to a commit SHA. dtolnay/rust-toolchain infers the channel from
        # the ref name, so when pinned we MUST set `toolchain` explicitly.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # mozjpeg (PDF image optimizer) builds libjpeg-turbo, which needs NASM to
      # assemble its x86_64 SIMD kernels. cmake is already present on the
      # GitHub-hosted runners. ARM macOS uses NEON intrinsics (no NASM), but
      # installing it everywhere is harmless and keeps the matrix uniform.
      - name: Install NASM (for mozjpeg)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      # Windows ships as a PORTABLE .exe, not an installer (see features.md and
      # commit 2eb4993) — hence bundle.targets ["app"] in tauri.conf.json, which
      # skips the MSI/NSIS bundlers. This is the raw binary cargo produces; its
      # name follows the Cargo package name (src-tauri/Cargo.toml → "talaria").
      # if-no-files-found: error so a future package rename fails the build
      # instead of silently uploading nothing, which is what happened when the
      # Talaria rebrand left this path pointing at the old binary name.
      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          if-no-files-found: error
          path: src-tauri/target/release/talaria.exe

      - name: Upload macOS artifacts (ARM)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS artifacts (Intel)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-build
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # Optional: Create a release with all artifacts
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    # generate_release_notes hits the Releases API; without an explicit
    # contents:write grant the default read-only GITHUB_TOKEN fails with
    # "Resource not accessible by integration".
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
