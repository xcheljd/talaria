name: Build Desktop Apps

on:
  push:
    branches:
      - release
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Rust stable
        # Pinned to a commit SHA. dtolnay/rust-toolchain infers the channel from
        # the ref name, so when pinned we MUST set `toolchain` explicitly.
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # mozjpeg (PDF image optimizer) builds libjpeg-turbo, which needs NASM to
      # assemble its x86_64 SIMD kernels. cmake is already present on the
      # GitHub-hosted runners. ARM macOS uses NEON intrinsics (no NASM), but
      # installing it everywhere is harmless and keeps the matrix uniform.
      - name: Install NASM (for mozjpeg)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        id: tauri
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: Stage Windows installers (diagnostic)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -x
          echo "artifactPaths=${{ steps.tauri.outputs.artifactPaths }}"
          echo "-- workspace-wide search for installers --"
          find "$GITHUB_WORKSPACE" -type f \( -name '*.msi' -o -name '*-setup.exe' \) 2>/dev/null || true
          mkdir -p windows-installers
          echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]?' 2>/dev/null | while read -r p; do
            case "$p" in
              *.msi|*-setup.exe)
                src="$(cygpath -u "$p" 2>/dev/null || echo "$p")"
                if cp "$src" windows-installers/ 2>/dev/null; then
                  echo "staged: $src"
                else
                  echo "MISSING: $src"
                fi ;;
            esac
          done
          echo "-- staged contents --"
          ls -la windows-installers || true

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-build
          if-no-files-found: warn
          path: windows-installers/*

      - name: Upload macOS artifacts (ARM)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

      - name: Upload macOS artifacts (Intel)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'x86_64')
        uses: actions/upload-artifact@v7
        with:
          name: macos-x64-build
          path: |
            src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

  # Optional: Create a release with all artifacts
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          files: artifacts/**/*
          draft: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
