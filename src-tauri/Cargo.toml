[package]
name = "communication-template-generator"
version = "1.4.0"
description = "Communication Template Generator"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "communication_template_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
base64 = "0.22"
lopdf = "0.41"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
mozjpeg = "0.10"
