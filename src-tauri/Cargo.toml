[package]
name = "talaria"
version = "1.5.0"
description = "Talaria — campaign email and communication template generator"
authors = ["you"]
# amatl (src/amatl.rs) is intentionally library-neutral for future extraction
# as its own crate; MIT OR Apache-2.0 is compatible with all of its deps:
# lopdf (MIT), image (MIT OR Apache-2.0), mozjpeg-sys (IJG/BSD-3-Clause, via
# libjpeg-turbo). Record the license now so the extraction step is a `git mv`.
license = "MIT OR Apache-2.0"
repository = ""
edition = "2021"
# Floor is dependency-driven: lopdf 0.44.0 ships an edition-2024 manifest (needs
# Cargo/Rust >= 1.85), and current image releases require rustc 1.88.
rust-version = "1.88.0"

[lib]
name = "talaria_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
log = "0.4"
base64 = "0.22"
# PDF optimization via the published picamatl crate (upstream of the old
# vendored src/amatl.rs, which was a copy of amatl 0.4.0). The optimizer's
# own dependency tree (lopdf, mozjpeg, rayon, flate2, zopfli, subsetter,
# fax, dicom-toolkit-jpeg2000) is picamatl's problem now.
# Pure Rust, no network calls, dual MIT OR Apache-2.0.
picamatl = "0.4.3"

[dev-dependencies]
# tests/generate_fixture.rs builds the committed fixture PDF directly with
# lopdf + image (the optimizer itself is picamatl; these are test tooling).
lopdf = { version = "0.44", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

