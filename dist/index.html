<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication Template Generator</title>
    <script>
      (function() {
        var theme = localStorage.getItem('theme') || 'light';
        var lightPalette = localStorage.getItem('lightPalette') || 'pastel';
        var darkPalette = localStorage.getItem('darkPalette') || 'midnight-blue';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-light-palette', lightPalette);
        document.documentElement.setAttribute('data-dark-palette', darkPalette);
      })();
    </script>
    <style>
      body {
        padding-top: 110px; /* Space for fixed header */
      }
    </style>
    <script type="module" crossorigin src="./assets/main-C_ggT8WS.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/pageTransitions-CIwueoGp.js">
    <link rel="stylesheet" crossorigin href="./assets/styles-ByJs9ogK.css">
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Communication Template Generator</h1>
        <div class="header-controls">
          <button
            class="theme-toggle"
            id="themeToggle"
            title="Toggle light/dark mode"
            aria-label="Toggle light/dark mode"
          >
            <div class="theme-toggle-slider"></div>
          </button>
          <a href="start.html" class="profile-link" title="Edit your profile">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
          <a
            href="promotion.html"
            class="nav-link"
            title="Promotion Email Generator"
          >
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
              <path d="M2 17l10 5 10-5"></path>
              <path d="M2 12l10 5 10-5"></path>
            </svg>
            Promotions
          </a>
        </div>
      </div>
      <div class="navigation" id="navigation">
        <div class="select-wrapper">
          <select
            class="template-select"
            id="templateSelect"
            aria-label="Select template"
          >
            <option value="">Select a template...</option>
          </select>
        </div>

        <div class="search-container">
          <input
            type="text"
            class="search-box"
            placeholder="Search templates..."
            id="searchBox"
            aria-label="Search templates"
          />
          <button
            class="clear-search"
            id="clearSearch"
            aria-label="Clear search"
          >
            ×
          </button>
          <div
            class="search-results"
            id="searchResults"
            role="listbox"
            aria-live="polite"
          >
            <div class="result-counter" id="resultCounter"></div>
          </div>
        </div>

        <div class="category-tabs">
          <button class="tab active" data-category="all">All</button>
          <button class="tab" data-category="Customer Email">Email</button>
          <button class="tab" data-category="Phone Orders">Phone</button>
          <button class="tab" data-category="Text">Text</button>
        </div>
      </div>
    </div>

    <div class="page-content">
    <div class="container">
      <div class="card">
        <h2 class="section-title" id="formSectionTitle">Template Fields</h2>
        <div id="formFields" class="form-grid">
          <div class="placeholder-message" id="formPlaceholder">
            <p>Select a template to begin</p>
          </div>
        </div>
        <div class="button-group">
          <button class="btn" id="generateBtn">Generate</button>
          <button class="btn" id="clearBtn" disabled>Clear</button>
        </div>
      </div>

      <div class="card output-card" id="outputCard">
        <h2 class="section-title">Generated Message</h2>
        <textarea
          class="output-textarea"
          id="outputArea"
          placeholder="Your generated message will appear here..."
          aria-label="Generated message output"
        ></textarea>
        <div class="button-group">
          <button class="btn" id="copyBtn">Copy Message</button>
          <button
            type="button"
            class="template-action-btn btn-base btn-secondary-base"
            id="saveTemplateBtn"
            title="Save current configuration"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"
              ></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save Template
          </button>
          <button
            type="button"
            class="template-action-btn btn-base btn-secondary-base"
            id="importTemplateBtn"
            title="Import saved configuration"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Import Template
          </button>
          <button
            type="button"
            class="template-action-btn btn-base btn-secondary-base"
            id="exportTemplateBtn"
            title="Export configuration as JSON"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            Export Template
          </button>
          <button
            type="button"
            class="btn-base btn-danger-base"
            id="startOverBtn"
            title="Reset everything to defaults"
          >
            <svg
              width="14"
              height="14"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
              <path d="M21 3v5h-5" />
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
              <path d="M8 16H3v5" />
            </svg>
            Start Over
          </button>
        </div>
      </div>
    </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- PDF Preview Modal -->
    <div id="pdfPreviewModal" class="pdf-preview-modal" style="display: none">
      <div class="pdf-modal-backdrop"></div>
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <h3 class="pdf-modal-title" id="pdfPreviewTitle"></h3>
          <button
            class="pdf-modal-close"
            id="pdfModalClose"
            aria-label="Close preview"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="pdf-modal-content">
          <iframe
            id="pdfPreviewIframe"
            class="pdf-modal-iframe"
            title="PDF Preview"
          ></iframe>
          <div class="pdf-loading-indicator" id="pdfLoadingIndicator">
            <div class="spinner"></div>
            <p>Loading PDF...</p>
          </div>
          <div
            class="pdf-error-message"
            id="pdfErrorMessage"
            style="display: none"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p>Unable to preview this PDF</p>
            <button class="pdf-download-fallback" id="pdfDownloadFallback">
              Download Instead
            </button>
          </div>
        </div>
        <div class="pdf-modal-footer">
          <button class="pdf-download-btn" id="pdfDownloadBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
        </div>
      </div>
    </div>

    <!-- Vite will automatically bundle and inject the JavaScript -->
  </body>
</html>
