<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Communication Template Generator</title>
    <script type="module" crossorigin src="./assets/main-BPhligcw.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/styles-DO2Wb68I.css">
  </head>
  <body>
    <div class="header">
      <div class="header-top">
        <h1>Communication Template Generator</h1>
        <div class="header-controls">
          <button
            class="theme-toggle"
            id="themeToggle"
            title="Toggle light/dark mode"
            aria-label="Toggle light/dark mode"
          >
            <div class="theme-toggle-slider"></div>
          </button>
          <a href="start.html" class="profile-link" title="Edit your profile">
            <svg
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            Profile
          </a>
        </div>
      </div>
      <div class="navigation" id="navigation">
        <select
          class="template-select"
          id="templateSelect"
          aria-label="Select template"
        >
          <option value="">Select a template...</option>
        </select>

        <div class="search-container">
          <input
            type="text"
            class="search-box"
            placeholder="Search templates..."
            id="searchBox"
            aria-label="Search templates"
          />
          <button
            class="clear-search"
            id="clearSearch"
            aria-label="Clear search"
          >
            ×
          </button>
          <div
            class="search-results"
            id="searchResults"
            role="listbox"
            aria-live="polite"
          >
            <div class="result-counter" id="resultCounter"></div>
          </div>
        </div>

        <div class="category-tabs">
          <button class="tab active" data-category="all">All</button>
          <button class="tab" data-category="Customer Email">Email</button>
          <button class="tab" data-category="Phone Orders">Phone</button>
          <button class="tab" data-category="Text">Text</button>
        </div>
      </div>
    </div>

    <div class="container">
      <div class="card">
        <h2 class="section-title" id="formSectionTitle">Template Fields</h2>
        <div id="formFields" class="form-grid">
          <div class="placeholder-message" id="formPlaceholder">
            <p>Select a template to begin</p>
          </div>
        </div>
        <div class="button-group">
          <button class="btn" id="generateBtn">Generate</button>
          <button class="btn" id="clearBtn" disabled>Clear</button>
        </div>
      </div>

      <div class="card output-card" id="outputCard">
        <h2 class="section-title">Generated Message</h2>
        <textarea
          class="output-textarea"
          id="outputArea"
          placeholder="Your generated message will appear here..."
          aria-label="Generated message output"
        ></textarea>
        <div class="button-group">
          <button class="btn" id="copyBtn">Copy Message</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- PDF Preview Modal -->
    <div id="pdfPreviewModal" class="pdf-preview-modal" style="display: none">
      <div class="pdf-modal-backdrop"></div>
      <div class="pdf-modal-container">
        <div class="pdf-modal-header">
          <h3 class="pdf-modal-title" id="pdfPreviewTitle"></h3>
          <button
            class="pdf-modal-close"
            id="pdfModalClose"
            aria-label="Close preview"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div class="pdf-modal-content">
          <iframe
            id="pdfPreviewIframe"
            class="pdf-modal-iframe"
            title="PDF Preview"
          ></iframe>
          <div class="pdf-loading-indicator" id="pdfLoadingIndicator">
            <div class="spinner"></div>
            <p>Loading PDF...</p>
          </div>
          <div
            class="pdf-error-message"
            id="pdfErrorMessage"
            style="display: none"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p>Unable to preview this PDF</p>
            <button class="pdf-download-fallback" id="pdfDownloadFallback">
              Download Instead
            </button>
          </div>
        </div>
        <div class="pdf-modal-footer">
          <button class="pdf-download-btn" id="pdfDownloadBtn">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download
          </button>
        </div>
      </div>
    </div>

    <!-- Vite will automatically bundle and inject the JavaScript -->
  </body>
</html>
